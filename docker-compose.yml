services:
  db:
    image: postgres:10.3
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: invoicing
      POSTGRES_USER: invoicing
  app:
    build: .
    ports:
      - "8080:5000"
    depends_on:
      - db
    environment:
      APP_ENV: dev
      APP_SECRET: "dev-secret-change-me"
      DATABASE_URL: postgres://invoicing:invoicing@db:5432/invoicing
      USE_MOCK_MAILER: "true"
    volumes:
      # default-settings.yml and templates/ (the invoice templates with their images)
      - ./storage:/storage:z

volumes:
  dbdata:
